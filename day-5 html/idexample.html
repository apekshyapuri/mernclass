<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>id use case in html</title>
    <style>
        div{
            height: 100vh;
            background-color: blue;
            
            margin-bottom: 10px;
            color: black;

        }
    </style>
</head>

<body>
    <ul>
        <a href="#Home">
            <li>Home</li>
        </a>
        <a href="#Contact">
            <li>Contact</li>
        </a>
        <a href="#About">
            <li>About</li>
        </a>
        <a href="#treaking">
            <li>trecking</li>
        </a>
        <div id="Home">Home</div>
        <div id="Contact">Contact</div>
        <div id="About">About</div>
        <div id="treaking">trecking</div>
    </ul>
</body>

</html>
