<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box shadow in css</title>
    <style>

        /*  inset use garyo vani shadow vhitra bata lagxa */
        .box{
            height: 200px;
            width: 200px;
            background-color: red;
            box-shadow: 10px 10px 25px -2px  brown inset ;


        }

        /* box-shadow: first, second, third, fourth, fifth */

        /* 
        first -> x-axis  (example : 20px from x-axis)
        second -> y-axis(example : 20px from y-axis)
        third -> blurness (example : 10px blur)
        fourth ->spread (example : 5px spread the color)
        fifth -> shadow-color (example : red color)*/

        /* multiple selection in single line -> ctrl + alt + down arrow
        
        multiple selection anywhere -> hold alt and click in desire location
        
        inset -> form shadow from inside of the box*/
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
