<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vertical navbar</title>

    <style>
        /* *{
            margin: 0;
            padding: 0;
        } */
        nav{
            border: 2px solid gray;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: start;
            width: 150px;
            border-radius: 20px;
            box-shadow: 4px 2px 6px 0px gray;

            

        }

        .code{
            padding: 20px;
        }

        ul{
            list-style-type: none;
            display: flex;
         flex-direction: column;
         gap: 8px;
         margin-left: -20px;
        }
    </style>
</head>
<body>
    <nav>
        <div class="code">Codinglab</div>
        <ul>
            <li>Dashboard</li>
            <li>Projects</li>
            <li>Notification</li>
            <li>Analytics</li>
            <li>Likes</li>
            <li>Wallets</li>
            <li>Messages</li>
        </ul>

        <ul class="log">
            <li>Logout</li>
            <li>Setting</li>
        </ul>
    </nav>
</body>
</html>
