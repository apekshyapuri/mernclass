        /* group selector */
        p,h3,span,div,h1{
            background-color: blue;

             font-size: 45px;

        body{

            color: brown;
        }
        html{
            background-color: blueviolet;
        }
        /* * and html both are same */
    </style>
</head>

   <h3 class="hi hello">Heading 3</h3>
