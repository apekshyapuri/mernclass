<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tables</title>
</head>
<body>
    <table border="n">
        <tr>
            <th>Name</th>
            <th>Caste</th>
            <th>Address</th>
        </tr>
        <tr>
            <td>Ram</td>
            <td>Thapa</td>
            <td>Ramkot</td>
        </tr>
        <tr>
            <td>Sita</td>
            <td>Magar</td>
            <td>Palpa</td>
        </tr>
        <tr>
            <td>Lily</td>
            <td>Sapkota</td>
            <td>Dang</td>
        </tr>
    </table>
    <br>

    <!-- Colspan -->
     <h3>Table (Colspan) </h3>

<table border="n" style="border-collapse: collapse;">
    <tr>
        <th>Name</th>
        <th colspan="2">telephone No</th>
    </tr>
    <tr>
        <td>Manish</td>
        <td>9876567890</td>
        <td>9865456321</td>
    </tr>
   
</table>
<br>
<!-- Rowspan -->
<h3>Table (Rowspan)</h3>
<table border="n" style="border-collapse: collapse;">
    <tr>
        <th>Name</th>
        <th>Telephone No</th>
    </tr>

     <tr>
        <td rowspan="2">Manish</td>
        <td>9876567890</td>
    </tr>
     <tr>
        
        <td>9734234546</td>
    </tr>


</table>

</body>
</html>
