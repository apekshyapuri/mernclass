<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables Example</title>
</head>

<body>
    <table border="n" style="border-collapse: collapse; text-align: center;">
        <tr>
            <th>S.N</th>
            <th colspan="2">Food items</th>
        </tr>
        <tr>
            <td rowspan="2">1</td>
            <td rowspan="2">Mo:Mo</td>
            <td>Chicken.Mo:Mo</td>

        </tr>
        <tr>
           
            <td>Veg.Mo:Mo</td>
        </tr>
        <tr>
            <td rowspan="2">2</td>
            <td rowspan="2">Burger</td>
            <td>Chicken Burger</td>

        </tr>
        <tr>
           
            <td>Veg Burger</td>
        </tr>

    </table>
<br><br>
    <table border="n" style="border-collapse: collapse;">
        <tr>
            <th>S.N</th>
            <th colspan="2">Subjects</th>
        </tr>
         <tr>
            <th>Mathematics</th>
            <th>Science</th>
            <th>Accountancy</th>
         </tr>
         <tr>
            <td>65</td>
            <td>47</td>
            <td>60</td>
         </tr>
         <tr>
            <td>55</td>
            <td>37</td>
            <td>40</td>
         </tr>

    </table>
</body>

</html>
