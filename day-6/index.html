<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symentic tags in html</title>
    <style>
div{
        display: flex;
        justify-content :space-between;

    }
    </style>
    
</head>
<body>
    <div>
        <img src="" alt="">
        <div>
            <h1>name</h1>
            <h2>Address</h2>
            <p>description</p>
        </div>
    </div>

    <!-- nav bar -->
     <!-- non semantic
      <div></div> -->

      <!-- semantic
       header
       footer -->



       <!-- Navigation bar using div -->
        <div>
            <h1>Logo</h1>
            <ul>
                <li>Home</li>
                <li>About</li>
            </ul>
        </div>
<br>
        <div>
            <h1>footer</h1>
        </div>

        <!-- there are too many div so the coder may not know what the div is using for eg: div use for navbar, img , header, footer etc -->
<!-- replacing div with nav so the coder can easily understand it is use for navbar -->
        <nav>
            <h1>Logo</h1>
            <ul>
                <li>Home</li>
                <li>About</li>
            </ul>
        </div>
        </nav>
        <main>
            <section>
                this is about page/section
            </section>
            section
        </main>

        <footer>
            this is a footer
        </footer>

<!--  structure -->
  <header></header>
  <nav></nav>
  <aside></aside> <main>
                    <article></article>
                    <figure></figure>
                    <p></p>
                     </main>
                    <footer></footer>
</body>
</html>
