<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        /* yedi hami le , ma use garem vani jastai div,p garyo vani sab change hunxa ...... yedi div>p use garem vane  div vhitra ko p vanne bhujinxa */


        /* div>p{
color: red;

        } */
/* child selector -> div vhitra vako paragraph lai matra colour payo ....... father ko child lai matra implement hunxa , child ko child lai hunna */
        div>p{
            color: red;
        }
       

        /* descended selector */div h5 p{
            color: green;
        }
        div h5 div a{
            color:rgb(194, 57, 146);
        }
        div h5 div p{
            background-color: red;
            height: 20px;
        }

         div>h1{
            color: blue;
        }
        
    </style>
</head>
<body>
    <div>
        <p>I am a paragraph</p>
        <p>Paraaaaaa</p>
        <h1>Heading 1</h1>
        <h5>
        <p>Second paragraph</p>
      <div>
            <p>hello</p>
            <a href="">I am a link</a>
        </div>
        </h5>
       <nav>
            <h1>hello</h1>
        </nav>
            <h1>great</h1>
       
        <nav><h1>wow</h1></nav>    </div>

</html>
