    multiple inline css diyo vane code dherai hunxa 
    2. internal css -> reduce multiple line code , reduce dublicate styling in similar elements  
    styling le dherai tham khayera external css ko use garnu parxa so that body vhitra ko code maintain hos
    3. External css -> arko file ma css ko xuttai file banayera link garne-->

<!-- Inline css -->
 
    <!-- <h1 style="color: blue; background-color:gold;">This is heading</h1>

<!-- Internal css -->

    <h1 id="css">This is first heading</h1>

    <p class="head">I am a paragraph</p>
    <p>I am second paragraph</p>
    
    <h1 class="head">This is second heading</h1>

    <div>I am a div</div>

    <!-- id ko lagi #
     class ko lagi .
     yedi 2 ota same element xa ra farak farak style chahiyeko xa vane id ra class use hunxa-->
