<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
.box1{
    font-size: 2rem;
}

.box2{
    /* em = font size(px) * fontsize(em) 
    font size = 10 * 4 */
    font-size: 10px;
    font-size: 4em;
}
    </style>
</head>
<body>
    <div class="box1">
        Box1
    </div>
    <div class="box2">
        Box2
    </div>
    
</body>
</html>
