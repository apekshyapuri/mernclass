<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h3>FORM</h3>
    <form action="/chiya.html">
        <label for="Fullname"></label>
        <input type="text" id="Fullname" placeholder="Full Name">

        <label for="email"></label>
        <input type="email" id="email" placeholder="Email Address">

        <label for="Phone"></label>
        <input type="number" id="Phone" placeholder="Phone Number">
        <br>

        <label for="">Destination/Trek</label>
        <select name="" id="">
            <option value="Langtang Vally">Langtang vally</option>
            <option value="ABC Trek">ABC Trek</option>
            <option value="EBC Trek">EBC Trek</option>
            <option value="Gosaikunda">Gosaikunda</option>
            <option value="Pach Pokhari">Pach Pokhari</option>
        </select>

        <textarea name="" id="" placeholder="Your Message" rows="5" cols="50"></textarea>
        <br>

      <input type="submit" value="Submit Enquiry">

    </form>
    <br> <br>
    <h3>New Form</h3>
    <form action="/day-1 html/fish image.jpg">
        <label for="from">FROM</label>
        <input type="text" id="from" placeholder="Kathmandu">

        <label for="to">TO</label>
        <input type="text" id="to" placeholder="Destination">

        <label for="Departure">DEPARTURE</label>
        <input type="date" id="Departure">

        <label for="adults">ADULTS</label>
        <input type="number" id="adults" placeholder="4">

        <label for="children">CHILDREN</label>
        <input type="number" id="childern" placeholder="0">

        <label for="fullname">FULL NAME</label>
        <input type="text" id="fullname" placeholder="Your name">

        <label for="phone">PHONE</label>
        <input type="number" id="phone" placeholder="98XXXXXXXX">

        <label for="email">EMAIL</label>
        <input type="email" id="email" placeholder="you@email.com">

        <label for="message">MESSAGE(optional)</label>
        <textarea name="" id="message" placeholder="Preferred airline, timing, notes" rows="2" cols="60"></textarea>

        <input type="submit" value="Send Booking Enquiry">


    </form>

    
</body>
</html>
